trigger:
  branches:
    exclude:
    - '*'
  tags:
    include:
    - 'v*.*.*'

pr: none

parameters:
- name: sourceTag
  displayName: Tag to release when manually queued
  type: string
  default: ''
- name: uploadToMaven
  displayName: Trigger the downstream Maven release
  type: boolean
  default: false
- name: createGitHubRelease
  displayName: Create the GitHub release
  type: boolean
  default: false
- name: uploadToAzure
  displayName: Upload artifacts to Azure Storage
  type: boolean
  default: false

pool:
  vmImage: ubuntu-latest

variables:
- group: azure-kusto-log4j-e2e

jobs:
- job: Release
  displayName: Build and publish release
  timeoutInMinutes: 60
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - bash: |
      set -euo pipefail

      source_ref="$(Build.SourceBranch)"
      if [[ -n "${SOURCE_TAG}" ]]; then
        source_ref="${SOURCE_TAG}"
        if [[ "${source_ref}" != refs/tags/* ]]; then
          source_ref="refs/tags/${source_ref}"
        fi
      elif [[ "${source_ref}" != refs/tags/* ]]; then
        echo "The sourceTag parameter is required for a manual release run." >&2
        exit 1
      fi

      release_tag="${source_ref#refs/tags/}"
      if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        echo "Release tag '${release_tag}' must match vx.y.z." >&2
        exit 1
      fi

      git fetch --force origin "${source_ref}"
      git checkout --detach FETCH_HEAD

      echo "##vso[task.setvariable variable=RELEASE_TAG]${release_tag}"
      echo "##vso[task.setvariable variable=RELEASE_COMMIT]$(git rev-parse HEAD)"
    displayName: Check out release tag
    env:
      SOURCE_TAG: ${{ parameters.sourceTag }}

  - task: JavaToolInstaller@0
    displayName: Use Java 8
    inputs:
      versionSpec: '8'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - task: Cache@2
    displayName: Cache Maven dependencies
    inputs:
      key: 'maven | "$(Agent.OS)" | **/pom.xml'
      restoreKeys: |
        maven | "$(Agent.OS)"
        maven
      path: $(Pipeline.Workspace)/.m2/repository

  - bash: mvn clean install javadoc:jar -B -DskipTests
    displayName: Build release artifacts
    env:
      MAVEN_OPTS: -Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository

  - bash: |
      set -euo pipefail

      version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
      mkdir -p staging
      cp kusto-log4j-appender/target/*.jar staging/
      cp kusto-log4j-appender/.flattened-pom.xml \
        "staging/kusto-log4j-appender-${version}.pom"

      echo "##vso[task.setvariable variable=PROJECT_VERSION]${version}"
    displayName: Stage release artifacts

  - task: PublishPipelineArtifact@1
    displayName: Publish staged artifacts
    inputs:
      targetPath: $(Build.SourcesDirectory)/staging
      artifact: release

  - task: GitHubRelease@1
    displayName: Create GitHub release
    condition: and(succeeded(), or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), ${{ eq(parameters.createGitHubRelease, true) }}))
    inputs:
      gitHubConnection: $(GITHUB_SERVICE_CONNECTION)
      repositoryName: Azure/azure-kusto-log4j
      action: create
      target: $(RELEASE_COMMIT)
      tagSource: userSpecifiedTag
      tag: $(RELEASE_TAG)
      title: $(RELEASE_TAG)
      releaseNotesSource: inline
      releaseNotesInline: Release $(RELEASE_TAG)
      assets: |
        $(Build.SourcesDirectory)/staging/*.jar
        $(Build.SourcesDirectory)/staging/*.pom
      addChangeLog: true

  - task: AzureCLI@2
    displayName: Upload artifacts to Azure Storage
    condition: and(succeeded(), or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), ${{ eq(parameters.uploadToAzure, true) }}))
    inputs:
      azureSubscription: $(AZURE_RELEASE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: $(Build.SourcesDirectory)
      inlineScript: |
        set -euo pipefail

        az storage blob upload-batch \
          --account-name "$(AZURE_STORAGE_ACCOUNT)" \
          --destination "$(AZURE_STORAGE_CONTAINER)" \
          --destination-path "$(AZURE_STORAGE_PATH_PREFIX)/$(PROJECT_VERSION)" \
          --source staging \
          --auth-mode login \
          --overwrite

  - bash: |
      set -euo pipefail

      encoded_name="$(
        python3 -c \
          'import os, urllib.parse; print(urllib.parse.quote(os.environ["PIPELINE_NAME"]))'
      )"
      definitions_url="${COLLECTION_URI}${TEAM_PROJECT}/_apis/build/definitions?name=${encoded_name}&api-version=7.1"
      definitions="$(
        curl --fail --silent --show-error \
          --header "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
          "${definitions_url}"
      )"
      pipeline_id="$(
        printf '%s' "${definitions}" |
          python3 -c \
            'import json, sys; values=json.load(sys.stdin).get("value", []); print(values[0]["id"] if len(values) == 1 else "")'
      )"

      if [[ -z "${pipeline_id}" ]]; then
        echo "Expected exactly one downstream pipeline named '${PIPELINE_NAME}'." >&2
        exit 1
      fi

      request_body="$(
        jq -n \
          --arg blobPath "$(AZURE_STORAGE_PATH_PREFIX)/$(PROJECT_VERSION)" \
          '{templateParameters: {BlobPath: $blobPath}}'
      )"
      curl --fail --silent --show-error \
        --request POST \
        --header "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
        --header "Content-Type: application/json" \
        --data "${request_body}" \
        "${COLLECTION_URI}${TEAM_PROJECT}/_apis/pipelines/${pipeline_id}/runs?api-version=7.1"
    displayName: Trigger downstream Maven release
    condition: and(succeeded(), or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), ${{ eq(parameters.uploadToMaven, true) }}))
    env:
      COLLECTION_URI: $(System.CollectionUri)
      TEAM_PROJECT: $(System.TeamProject)
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      PIPELINE_NAME: $(DOWNSTREAM_PIPELINE_NAME)
